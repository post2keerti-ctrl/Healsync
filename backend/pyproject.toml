[project]
name = "healsync-backend"
version = "0.1.0"
description = "HealSync recovery coordination API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "pypdf>=5,<6",
  "rapidocr-onnxruntime>=1.2.3,<2",
  "firebase-admin>=6.5,<7",
  "functions-framework>=3.8,<4"
]

[project.optional-dependencies]
local = [
  "pillow>=10,<11",
  "pytesseract>=0.3,<1",
  "spacy>=3.8,<4",
  "httpx>=0.27,<1"
]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
