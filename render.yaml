services:
  - type: web
    name: healsync-demo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: ENABLE_DEV_AUTH
        value: "true"
      - key: DEV_JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false        # set in Render's dashboard — never commit real secrets
